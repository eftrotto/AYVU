<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reko · AYVU</title>
  <link rel="stylesheet" href="css/reko.css">
</head>
<body>
  <div class="reko-page">

    <header class="reko-header">
      <span class="reko-eyebrow">AYVU</span>
      <h1>Reko — como você está</h1>
    </header>

    <main class="reko-card">

      <!-- Estado: já respondeu hoje -->
      <section id="rekoViewJaFeito" class="reko-view reko-view--centro" hidden>
        <span class="reko-icone-grande">✅</span>
        <h2>Você já fez o check-in de hoje</h2>
        <p class="reko-texto-suave">Volte amanhã pra contar como você está.</p>
      </section>

      <!-- Estado: questionário -->
      <section id="rekoViewWizard" class="reko-view">
        <div class="reko-progress-row">
          <div class="reko-progress-track">
            <div class="reko-progress-fill" id="rekoProgressBar"></div>
          </div>
          <span class="reko-progress-label" id="rekoProgressLabel">Pergunta 1 de 5</span>
        </div>

        <div class="reko-question-card" id="rekoQuestionCard">
          <p class="reko-question-text" id="rekoQuestionText"></p>
          <div class="reko-options" id="rekoOptions"></div>
        </div>

        <button type="button" id="rekoVoltarBtn" class="reko-btn-ghost" hidden>‹ Voltar</button>
      </section>

      <!-- Estado: concluído agora -->
      <section id="rekoViewObrigado" class="reko-view reko-view--centro" hidden>
        <span class="reko-icone-grande">🌱</span>
        <h2>Prontinho!</h2>
        <p class="reko-texto-suave">Obrigado por compartilhar como você está hoje.</p>
      </section>

    </main>
  </div>

  <script src="js/reko.js"></script>
</body>
</html>
