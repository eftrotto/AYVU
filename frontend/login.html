<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · AYVU</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">

    <header class="login-header">
      <img class="login-logo" src="assets/logo.png" alt="AYVU">
      <h1>Educação que escuta</h1>
    </header>

    <main class="login-card">
      <form id="loginForm" class="login-form" novalidate>

        <div class="login-field">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" autocomplete="email" required>
        </div>

        <div class="login-field">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" autocomplete="current-password" minlength="6" required>
        </div>

        <!-- Só aparecem no modo "Criar conta" -->
        <div class="login-field login-field--cadastro" id="campoNome" hidden>
          <label for="cadastroNome">Nome</label>
          <input type="text" id="cadastroNome" autocomplete="name">
        </div>

        <div class="login-field login-field--cadastro" id="campoTipo" hidden>
          <label>Eu sou</label>
          <div class="login-tipo-opcoes">
            <label class="login-tipo-opcao">
              <input type="radio" name="tipo" value="aluno" checked>
              <span>Aluno</span>
            </label>
            <label class="login-tipo-opcao">
              <input type="radio" name="tipo" value="professor">
              <span>Professor</span>
            </label>
          </div>
        </div>

        <p id="loginErro" class="login-erro" role="alert" hidden></p>

        <button type="submit" id="loginSubmitBtn" class="login-btn-primary">Entrar</button>
      </form>

      <button type="button" id="loginToggleBtn" class="login-btn-ghost">Criar conta</button>
    </main>

    <p class="login-aviso">
      MVP de hackathon: login simples só pra demonstrar o fluxo. Sem recuperação de
      senha, verificação de e-mail ou proteção contra força bruta nesta etapa.
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
